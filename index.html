<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#1f3b2c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Cacho</title>
<style>
  :root {
    --mesa: #1f3b2c;
    --mesa-oscura: #142a1f;
    --cuero: #6b3a1f;
    --cuero-claro: #8c5230;
    --cuero-oscuro: #3f2010;
    --dado: #fbf7ee;
    --punto: #1b1b1b;
    --as: #b3261e;
    --texto: #f3efe4;
    --texto-suave: #b9c4bb;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; }
  body {
    background: radial-gradient(ellipse at 50% 45%, var(--mesa) 0%, var(--mesa-oscura) 100%);
    color: var(--texto);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    overflow: hidden;
    user-select: none; -webkit-user-select: none;
    touch-action: none;
  }
  .app {
    height: 100%;
    display: flex; flex-direction: column;
    padding: max(16px, env(safe-area-inset-top)) 16px max(16px, env(safe-area-inset-bottom));
  }

  /* Barra superior: cantidad de dados */
  .barra { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .titulo { font-size: 22px; font-weight: 800; letter-spacing: .5px; }
  .contador { display: flex; align-items: center; gap: 10px; font-size: 15px; color: var(--texto-suave); }
  .contador button {
    width: 38px; height: 38px; border-radius: 50%;
    border: 1.5px solid rgba(255,255,255,.25); background: rgba(0,0,0,.2);
    color: var(--texto); font-size: 22px; line-height: 1; cursor: pointer;
  }
  .contador button:disabled { opacity: .3; }
  .contador b { color: var(--texto); font-size: 20px; min-width: 14px; text-align: center; }

  /* Mesa */
  .mesa { flex: 1; position: relative; display: flex; align-items: center; justify-content: center; }
  .dados {
    position: absolute; left: 50%; top: 50%;
    width: min(78vw, 330px); height: min(78vw, 330px);
    transform: translate(-50%, -50%);
  }
  .dado {
    position: absolute; width: 27%; aspect-ratio: 1;
    background: var(--dado); border-radius: 18%;
    box-shadow: inset 0 -4px 0 rgba(0,0,0,.12), 0 6px 12px rgba(0,0,0,.35);
    transition: transform .35s cubic-bezier(.2,.9,.3,1.3);
  }
  .dado svg { display: block; }

  /* El cacho */
  .cacho {
    position: absolute; left: 50%; top: 50%;
    width: min(88vw, 370px); height: min(92vw, 390px);
    transform: translate(-50%, -50%);
    transition: transform .45s cubic-bezier(.2,.8,.2,1);
    cursor: grab; z-index: 2;
    filter: drop-shadow(0 18px 22px rgba(0,0,0,.5));
  }
  .cacho svg { width: 100%; height: 100%; display: block; }
  .cacho.levantado { transform: translate(-50%, -128%) scale(.9); }
  .cacho.destapado { transform: translate(-50%, -150%) scale(.75); opacity: 0; pointer-events: none; transition: transform .5s, opacity .4s .1s; }
  .cacho.agitando { animation: agitar .09s linear infinite alternate; }
  @keyframes agitar {
    from { transform: translate(-53%, -50%) rotate(-4deg); }
    to   { transform: translate(-47%, -51%) rotate(4deg); }
  }

  .ayuda {
    text-align: center; font-size: 15px; color: var(--texto-suave);
    min-height: 44px; display: flex; align-items: center; justify-content: center;
    padding: 0 8px;
  }
  .resumen { text-align: center; font-size: 15px; color: var(--texto); min-height: 22px; }
  .resumen span { color: var(--as); font-weight: 700; }

  .botones { display: flex; gap: 12px; }
  .botones button {
    flex: 1; height: 58px; border-radius: 16px; border: none;
    font-size: 18px; font-weight: 700; cursor: pointer;
  }
  .principal { background: #e9c46a; color: #2a1d08; box-shadow: 0 4px 0 #a7843a; }
  .principal:active { transform: translateY(3px); box-shadow: 0 1px 0 #a7843a; }
  .secundario { background: rgba(0,0,0,.28); color: var(--texto); border: 1.5px solid rgba(255,255,255,.2) !important; }
  .botones button:disabled { opacity: .35; }

  .opciones { display: flex; align-items: center; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
  .chip {
    height: 34px; padding: 0 14px; border-radius: 17px;
    border: 1.5px solid rgba(255,255,255,.22); background: rgba(0,0,0,.2);
    color: var(--texto); font-size: 14px; font-weight: 600; cursor: pointer;
  }
  .chip:disabled { opacity: .35; }
  .chip[aria-pressed="true"] { background: #e9c46a; color: #2a1d08; border-color: #e9c46a; }
  .reserva {
    margin-left: auto; font-size: 13px; font-weight: 700; color: #2a1d08;
    background: #9fd4a8; border-radius: 12px; padding: 4px 10px;
  }
  .reserva:empty { display: none; }
  .resumen em { font-style: normal; font-weight: 800; color: #e9c46a; }
  .eliminado .chip { margin-top: 8px; }
  .eliminado {
    position: absolute; inset: 0; display: none; flex-direction: column;
    align-items: center; justify-content: center; text-align: center; gap: 8px;
  }
  .eliminado.visible { display: flex; }
  .eliminado big { font-size: 28px; font-weight: 800; }
</style>
</head>
<body>
<div class="app">
  <div class="barra">
    <div class="titulo">Cacho</div>
    <div class="contador">
      <button id="menos" aria-label="Quitar un dado">−</button>
      <span><b id="num">5</b> dados</span>
      <button id="mas" aria-label="Agregar un dado">+</button>
    </div>
  </div>
  <div class="opciones">
    <button class="chip" id="inicial">Tirada inicial</button>
    <button class="chip" id="ciega" aria-pressed="false">Ronda ciega</button>
    <span class="reserva" id="reserva"></span>
  </div>

  <div class="mesa" id="mesa">
    <div class="dados" id="dados"></div>
    <div class="eliminado" id="eliminado">
      <big>Sin dados</big>
      <span>Quedaste eliminado.</span>
      <button class="chip" id="nueva">Nueva partida</button>
    </div>
    <div class="cacho" id="cacho">
      <svg viewBox="0 0 200 210" aria-hidden="true">
        <defs>
          <linearGradient id="cuero" x1="0" x2="1">
            <stop offset="0" stop-color="#3f2010"/>
            <stop offset=".35" stop-color="#8c5230"/>
            <stop offset=".55" stop-color="#7a4426"/>
            <stop offset="1" stop-color="#3a1d0e"/>
          </linearGradient>
          <linearGradient id="borde" x1="0" x2="1">
            <stop offset="0" stop-color="#2b150a"/>
            <stop offset=".4" stop-color="#5c3118"/>
            <stop offset="1" stop-color="#24110a"/>
          </linearGradient>
        </defs>
        <!-- cuerpo (vaso boca abajo) -->
        <path d="M45 18 Q100 6 155 18 L182 182 Q100 200 18 182 Z" fill="url(#cuero)"/>
        <!-- fondo del vaso arriba -->
        <ellipse cx="100" cy="18" rx="55" ry="10" fill="#4a2512"/>
        <ellipse cx="100" cy="17" rx="47" ry="7" fill="#5e321a"/>
        <!-- costuras -->
        <path d="M40 52 Q100 40 160 52" fill="none" stroke="#d9b77f" stroke-width="2" stroke-dasharray="6 5" opacity=".7"/>
        <path d="M26 150 Q100 165 174 150" fill="none" stroke="#d9b77f" stroke-width="2" stroke-dasharray="6 5" opacity=".7"/>
        <!-- borde de la boca -->
        <path d="M18 182 Q100 200 182 182 L184 192 Q100 212 16 192 Z" fill="url(#borde)"/>
        <!-- brillo -->
        <path d="M70 30 Q62 100 55 175" stroke="rgba(255,255,255,.13)" stroke-width="10" fill="none" stroke-linecap="round"/>
      </svg>
    </div>
  </div>

  <div class="resumen" id="resumen"></div>
  <div class="ayuda" id="ayuda">Toca «Agitar» o sacude el celular</div>
  <div class="botones">
    <button class="secundario" id="destapar" disabled>Destapar</button>
    <button class="principal" id="agitar">Agitar</button>
  </div>
</div>

<script>
(() => {
  const MAX = 5;
  const $ = id => document.getElementById(id);
  const cacho = $('cacho'), dadosEl = $('dados'), ayuda = $('ayuda'), resumen = $('resumen');
  const btnAgitar = $('agitar'), btnDestapar = $('destapar');
  const btnMenos = $('menos'), btnMas = $('mas'), numEl = $('num'), eliminado = $('eliminado');
  const btnInicial = $('inicial'), btnCiega = $('ciega'), reservaEl = $('reserva'), btnNueva = $('nueva');

  // Puntos de cada cara en una cuadrícula 3x3 (índices 0..8)
  const CARAS = { 1:[4], 2:[2,6], 3:[2,4,6], 4:[0,2,6,8], 5:[0,2,4,6,8], 6:[0,2,3,5,6,8] };
  const NOMBRES = { 1:'ases', 2:'tontos', 3:'trenes', 4:'cuadras', 5:'quinas', 6:'senas' };

  let cantidad = leer('cacho.cantidad', MAX, 0, MAX);
  let reserva = leer('cacho.reserva', 0, 0, 99);   // dados ganados cazando con 5 (escudo)
  let valores = [];
  let estado = 'listo';   // listo | agitando | tapado | destapado | inicial
  let ciega = false;      // ronda ciega: la inicia alguien que quedó con 1 dado

  function leer(k, def, min, max) {
    try { const v = parseInt(localStorage.getItem(k), 10); return v >= min && v <= max ? v : def; }
    catch { return def; }
  }
  function guardar() {
    try { localStorage.setItem('cacho.cantidad', cantidad); localStorage.setItem('cacho.reserva', reserva); } catch {}
  }

  // Posiciones de los dados según cuántos hay (en % del área)
  const POS = {
    1: [[36.5,36.5]],
    2: [[18,36.5],[55,36.5]],
    3: [[18,20],[55,20],[36.5,55]],
    4: [[18,18],[55,18],[18,55],[55,55]],
    5: [[8,12],[46,6],[66,38],[30,44],[10,72]].map(([x,y]) => [x+4, y+2]),
  };

  function dibujarDados() {
    dadosEl.innerHTML = '';
    const pos = POS[valores.length] || [];
    valores.forEach((v, i) => {
      const d = document.createElement('div');
      d.className = 'dado' + (v === 1 ? ' as' : '');
      const [x, y] = pos[i];
      d.style.left = x + '%'; d.style.top = y + '%';
      d.style.transform = `rotate(${Math.round(Math.random()*40 - 20)}deg)`;
      const color = v === 1 ? 'var(--as)' : 'var(--punto)';
      const r = v === 1 ? 15 : 10;
      d.innerHTML = '<svg viewBox="0 0 100 100" width="100%" height="100%">' +
        CARAS[v].map(c => `<circle cx="${22 + (c % 3) * 28}" cy="${22 + Math.floor(c / 3) * 28}" r="${r}" fill="${color}"/>`).join('') +
        '</svg>';
      dadosEl.appendChild(d);
    });
  }

  const tieneSalpicon = () => valores.length === 5 && new Set(valores).size === 5;

  function textoResumen() {
    if (!valores.length) return '';
    if (estado === 'inicial') return `Sacaste <em>${valores[0]}</em>`;
    const cuenta = {};
    valores.forEach(v => cuenta[v] = (cuenta[v] || 0) + 1);
    let t = Object.keys(cuenta).sort((a,b) => a-b)
      .map(k => k == 1 ? `<span>${cuenta[k]} ${cuenta[k] > 1 ? 'ases' : 'as'}</span>`
                       : `${cuenta[k]} ${NOMBRES[k]}`)
      .join(' · ');
    if (tieneSalpicon()) t += ' · <em>¡Salpicón!</em>';
    return t;
  }

  // ¿Puede este jugador mirar sus dados? En ronda ciega solo quien tiene 1 dado.
  const puedeMirar = () => !(ciega && cantidad > 1);

  // Con el cacho puesto los dados no se dibujan, para que no se asome ninguna esquina.
  // Al bajar el cacho se esconden cuando termina de taparlos.
  let timerOcultar;
  function ajustarVisibilidad() {
    const tapados = estado === 'agitando' || (estado === 'tapado' && !cacho.classList.contains('levantado'));
    clearTimeout(timerOcultar);
    if (!tapados) dadosEl.style.visibility = '';
    else if (estado === 'agitando') dadosEl.style.visibility = 'hidden';
    else timerOcultar = setTimeout(() => { dadosEl.style.visibility = 'hidden'; }, 350);
  }

  function actualizarUI() {
    ajustarVisibilidad();
    const ocupado = estado === 'agitando';
    numEl.textContent = cantidad;
    reservaEl.textContent = reserva ? `+${reserva} de reserva` : '';
    btnMenos.disabled = (cantidad <= 0 && !reserva) || ocupado;
    btnMas.disabled = ocupado;
    btnMas.setAttribute('aria-label', cantidad >= MAX ? 'Ganar un dado de reserva' : 'Agregar un dado');
    btnInicial.disabled = ocupado || cantidad === 0;
    btnCiega.disabled = ocupado || estado === 'tapado' || cantidad === 0;
    btnCiega.setAttribute('aria-pressed', ciega);
    eliminado.classList.toggle('visible', cantidad === 0);
    cacho.style.display = cantidad === 0 ? 'none' : '';
    btnAgitar.disabled = cantidad === 0 || ocupado;
    btnDestapar.disabled = estado !== 'tapado';
    btnAgitar.textContent = estado === 'destapado' ? 'Nueva ronda' : 'Agitar';
    cacho.classList.toggle('destapado', estado === 'destapado' || estado === 'inicial');
    resumen.innerHTML = (estado === 'destapado' || estado === 'inicial' || cacho.classList.contains('levantado')) ? textoResumen() : '';
    ayuda.textContent = {
      listo: ciega ? (cantidad > 1 ? 'Ronda ciega: esta ronda no podrás ver tus dados' : 'Ronda ciega: con 1 dado sí puedes mirar el tuyo')
                   : 'Toca «Agitar» o sacude el celular',
      agitando: 'Agitando…',
      tapado: puedeMirar() ? 'Mantén presionado el cacho para mirar tus dados'
                           : 'Ronda ciega: no puedes mirar tus dados',
      destapado: 'Dados a la vista de todos',
      inicial: 'El dado más alto empieza. Si empatan, vuelven a tirar los empatados.',
    }[estado];
    if (cantidad === 0) ayuda.textContent = '';
  }

  function agitar(n = cantidad, inicial = false) {
    if (cantidad === 0 || estado === 'agitando') return;
    estado = 'agitando';
    cacho.classList.remove('levantado', 'destapado');
    cacho.classList.add('agitando');
    dadosEl.style.visibility = 'hidden';
    vibrar([30, 40, 30, 40, 30, 40, 30]);
    sonidoAgitar();
    actualizarUI();
    setTimeout(() => {
      valores = Array.from({ length: n }, () => 1 + Math.floor(rand() * 6));
      dibujarDados();
      cacho.classList.remove('agitando');
      dadosEl.style.visibility = '';
      estado = inicial ? 'inicial' : 'tapado';
      vibrar(60);
      actualizarUI();
    }, 900);
  }

  function rand() {
    const a = new Uint32Array(1); crypto.getRandomValues(a); return a[0] / 4294967296;
  }

  // Mirar: mantener presionado el cacho
  function mirar(on) {
    if (estado !== 'tapado') return;
    if (on && !puedeMirar()) { vibrar([20, 60, 20]); return; }
    cacho.classList.toggle('levantado', on);
    actualizarUI();
  }
  cacho.addEventListener('pointerdown', e => { e.preventDefault(); try { cacho.setPointerCapture(e.pointerId); } catch {} mirar(true); });
  ['pointerup', 'pointercancel', 'lostpointercapture'].forEach(ev => cacho.addEventListener(ev, () => mirar(false)));
  cacho.addEventListener('contextmenu', e => e.preventDefault());

  btnAgitar.addEventListener('click', () => { pedirPermisoMovimiento(); agitar(); });
  btnInicial.addEventListener('click', () => { pedirPermisoMovimiento(); agitar(1, true); });
  btnDestapar.addEventListener('click', () => {
    estado = 'destapado';
    ciega = false;          // la ronda ciega aplica solo a la ronda que se acaba de jugar
    vibrar(40); actualizarUI();
  });
  btnCiega.addEventListener('click', () => { ciega = !ciega; actualizarUI(); });
  btnMenos.addEventListener('click', () => perderDado());
  btnMas.addEventListener('click', () => ganarDado());
  btnNueva.addEventListener('click', () => { cantidad = MAX; reserva = 0; ciega = false; reiniciarMesa(); });

  // Perder: primero se gasta la reserva (escudo); si no hay, se pierde un dado.
  function perderDado() {
    if (reserva > 0) reserva--;
    else if (cantidad > 0) cantidad--;
    reiniciarMesa();
  }
  // Ganar (cazar bien): con 5 dados no hay sexto dado, se guarda uno de reserva.
  function ganarDado() {
    if (cantidad >= MAX) reserva++;
    else cantidad++;
    reiniciarMesa();
  }
  function reiniciarMesa() {
    guardar();
    valores = []; dadosEl.innerHTML = '';
    estado = 'listo';
    cacho.classList.remove('levantado', 'destapado');
    actualizarUI();
  }

  // Sacudir el celular para agitar
  let permisoPedido = false, ultimaSacudida = 0;
  function pedirPermisoMovimiento() {
    if (permisoPedido) return;
    permisoPedido = true;
    const DME = window.DeviceMotionEvent;
    if (DME && typeof DME.requestPermission === 'function') {
      DME.requestPermission().then(r => { if (r === 'granted') escucharMovimiento(); }).catch(() => {});
    } else if (DME) {
      escucharMovimiento();
    }
  }
  function escucharMovimiento() {
    window.addEventListener('devicemotion', e => {
      const a = e.acceleration || e.accelerationIncludingGravity;
      if (!a) return;
      const fuerza = Math.hypot(a.x || 0, a.y || 0, a.z || 0);
      const umbral = e.acceleration ? 18 : 30;
      const ahora = Date.now();
      if (fuerza > umbral && ahora - ultimaSacudida > 1500 && estado !== 'agitando' && estado !== 'tapado') {
        ultimaSacudida = ahora; agitar();
      }
    });
  }
  // En Android no hace falta permiso: escuchamos desde el primer toque
  document.addEventListener('pointerdown', pedirPermisoMovimiento, { once: true });

  function vibrar(p) { try { navigator.vibrate && navigator.vibrate(p); } catch {} }

  // Sonido de dados dentro del cacho (generado, sin archivos)
  let audio;
  function sonidoAgitar() {
    try {
      audio = audio || new (window.AudioContext || window.webkitAudioContext)();
      const t0 = audio.currentTime;
      for (let i = 0; i < 14; i++) {
        const t = t0 + i * 0.06 + Math.random() * 0.03;
        const len = 0.03;
        const buf = audio.createBuffer(1, Math.floor(audio.sampleRate * len), audio.sampleRate);
        const d = buf.getChannelData(0);
        for (let j = 0; j < d.length; j++) d[j] = (Math.random() * 2 - 1) * Math.pow(1 - j / d.length, 3);
        const src = audio.createBufferSource(); src.buffer = buf;
        const f = audio.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = 1800 + Math.random() * 1500; f.Q.value = 2;
        const g = audio.createGain(); g.gain.value = 0.5;
        src.connect(f).connect(g).connect(audio.destination);
        src.start(t);
      }
    } catch {}
  }

  actualizarUI();
})();
</script>
</body>
</html>

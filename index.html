<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0c2a1b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<title>Cacho</title>
<style>
  :root {
    --oro: #d8b46a;
    --oro-oscuro: #9c7a36;
    --texto: #f4efe3;
    --texto-suave: #c9c2b2;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; }
  body {
    background: #0c2a1b; color: var(--texto);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    overflow: hidden; overscroll-behavior: none;
    user-select: none; -webkit-user-select: none; touch-action: none;
  }
  #escena { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }

  /* ---------- Barra superior ---------- */
  .barra {
    position: fixed; left: 0; right: 0; top: 0; z-index: 5;
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    padding: max(14px, env(safe-area-inset-top)) 16px 0; pointer-events: none;
  }
  .barra > * { pointer-events: auto; }
  .pastilla, .icono {
    height: 44px; border-radius: 22px; border: 1px solid rgba(255,255,255,.18);
    background: rgba(10,6,3,.55); color: var(--texto);
    backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
    font-size: 15px; font-weight: 700; cursor: pointer;
  }
  .pastilla { padding: 0 14px; display: flex; align-items: center; gap: 6px; }
  .pastilla .res { font-size: 12px; color: #1b3a22; background: #9fd4a8; border-radius: 10px; padding: 2px 7px; }
  .pastilla .res:empty { display: none; }
  .icono { width: 44px; display: grid; place-items: center; padding: 0; }
  .boton-oro {
    height: 48px; padding: 0 22px; border-radius: 14px; border: 1px solid #6e5222;
    background: linear-gradient(180deg, #e9cd8c 0%, var(--oro) 45%, var(--oro-oscuro) 100%);
    color: #2b1b07; font-size: 16px; font-weight: 800; letter-spacing: 1.5px; text-transform: uppercase;
    box-shadow: inset 0 2px 0 rgba(255,255,255,.55), 0 4px 10px rgba(0,0,0,.45); cursor: pointer;
  }
  .boton-oro:disabled { filter: grayscale(.8) brightness(.55); }

  /* ---------- Textos sobre la mesa ---------- */
  .pista {
    position: fixed; left: 50%; bottom: max(22px, env(safe-area-inset-bottom)); z-index: 4;
    transform: translateX(-50%); width: max-content; max-width: calc(100vw - 32px);
    text-align: center; font-size: 15px; font-weight: 600; color: var(--texto);
    text-shadow: 0 1px 4px rgba(0,0,0,.8); pointer-events: none;
  }
  .pista .flecha { display: inline-block; animation: subir 1.4s ease-in-out infinite; margin-right: 6px; }
  @keyframes subir { 0%,100% { transform: translateY(3px); opacity: .5; } 50% { transform: translateY(-3px); opacity: 1; } }
  .resumen {
    position: fixed; left: 50%; bottom: calc(max(22px, env(safe-area-inset-bottom)) + 34px); z-index: 4;
    transform: translateX(-50%); width: max-content; max-width: calc(100vw - 32px);
    padding: 8px 14px; border-radius: 14px; text-align: center; line-height: 1.4;
    background: rgba(10,6,3,.72); font-size: 15px; font-weight: 600;
    opacity: 0; transition: opacity .2s; pointer-events: none;
  }
  .resumen.visible { opacity: 1; }
  .resumen span { color: #ff8a80; font-weight: 800; }
  .resumen em { font-style: normal; font-weight: 800; color: var(--oro); }
  .aviso {
    position: fixed; left: 50%; top: calc(max(14px, env(safe-area-inset-top)) + 58px); z-index: 7;
    transform: translate(-50%, -8px); opacity: 0; transition: opacity .2s, transform .2s;
    width: max-content; max-width: calc(100vw - 32px); text-align: center;
    padding: 9px 14px; border-radius: 12px; background: rgba(10,6,3,.85);
    font-size: 14px; font-weight: 600; pointer-events: none;
  }
  .aviso.visible { opacity: 1; transform: translate(-50%, 0); }
  .cargando, .eliminado {
    position: fixed; inset: 0; z-index: 3; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 10px; text-align: center; padding: 16px;
    pointer-events: none;
  }
  .eliminado { display: none; }
  .eliminado.visible { display: flex; }
  .eliminado big { font-size: 30px; font-weight: 800; }

  /* ---------- Menú ---------- */
  .velo { position: fixed; inset: 0; z-index: 8; background: rgba(0,0,0,.5); opacity: 0; pointer-events: none; transition: opacity .2s; }
  .velo.abierto { opacity: 1; pointer-events: auto; }
  .menu {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 9;
    background: #1b130c; border-top: 1px solid rgba(255,255,255,.12); border-radius: 22px 22px 0 0;
    padding: 18px 16px max(18px, env(safe-area-inset-bottom));
    transform: translateY(105%); transition: transform .28s cubic-bezier(.2,.8,.2,1);
    max-width: 520px; margin: 0 auto;
  }
  .menu.abierto { transform: none; }
  .menu h2 { margin: 0 0 4px; font-size: 18px; }
  .menu p { margin: 0 0 14px; font-size: 14px; color: var(--texto-suave); line-height: 1.4; }
  .contador { display: flex; align-items: center; justify-content: center; gap: 22px; margin: 6px 0 4px; }
  .contador button {
    width: 56px; height: 56px; border-radius: 50%; border: 1px solid rgba(255,255,255,.2);
    background: rgba(255,255,255,.06); color: var(--texto); font-size: 28px; cursor: pointer;
  }
  .contador button:disabled { opacity: .3; }
  .contador .n { font-size: 44px; font-weight: 800; min-width: 40px; text-align: center; }
  .nota { text-align: center; font-size: 13px; color: var(--texto-suave); min-height: 18px; margin-bottom: 14px; }
  .acciones { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .acciones button {
    height: 50px; border-radius: 14px; border: 1px solid rgba(255,255,255,.18);
    background: rgba(255,255,255,.06); color: var(--texto); font-size: 15px; font-weight: 700; cursor: pointer;
  }
  .acciones button:disabled { opacity: .35; }
  .acciones button[aria-pressed="true"] { background: var(--oro); color: #2b1b07; border-color: var(--oro); }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }

<body>
<canvas id="escena"></canvas>
<div class="cargando" id="cargando">Cargando la mesa…</div>

<div class="resumen" id="resumen"></div>
<div class="pista" id="pista"></div>
<div class="aviso" id="aviso" role="status"></div>
<div class="eliminado" id="eliminado"><big>Sin dados</big><span>Quedaste eliminado.</span></div>

<div class="barra">
  <button class="pastilla" id="abrirMenu" aria-label="Tus dados y opciones"><span id="numBarra">5</span> dados <span class="res" id="resBarra"></span></button>
  <button class="boton-oro" id="destapar" disabled>Destapar</button>
  <button class="icono" id="abrirMenu2" aria-label="Opciones">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
  </button>
</div>

<div class="velo" id="velo"></div>
<div class="menu" id="menu" role="dialog" aria-label="Opciones">
  <h2>Tus dados</h2>
  <p>Toca − cuando pierdas un dado y + cuando caces bien. Con 5 dados, cazar bien te da un dado de reserva.</p>
  <div class="contador">
    <button id="menos" aria-label="Perder un dado">−</button>
    <span class="n" id="num">5</span>
    <button id="mas" aria-label="Ganar un dado">+</button>
  </div>
  <div class="nota" id="nota"></div>
  <div class="acciones">
    <button id="inicial">Tirada inicial</button>
    <button id="ciega" aria-pressed="false">Ronda ciega</button>
    <button id="nueva">Nueva partida</button>
    <button id="cerrar">Listo</button>
  </div>
</div>

<script type="module">
import * as THREE from 'three';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';

const MAX = 5;
const $ = id => document.getElementById(id);
const canvas = $('escena'), resumen = $('resumen'), pista = $('pista');
const btnDestapar = $('destapar'), eliminado = $('eliminado'), menu = $('menu'), velo = $('velo');
const btnMenos = $('menos'), btnMas = $('mas'), numEl = $('num'), nota = $('nota');
const btnInicial = $('inicial'), btnCiega = $('ciega'), btnNueva = $('nueva');

const NOMBRES = { 1: 'ases', 2: 'patos', 3: 'trenes', 4: 'cuadras', 5: 'quinas', 6: 'senas' };
const NOMBRE1 = { 1: 'as', 2: 'pato', 3: 'tren', 4: 'cuadra', 5: 'quina', 6: 'sena' };

let cantidad = leer('cacho.cantidad', MAX, 0, MAX);
let reserva = leer('cacho.reserva', 0, 0, 99);
let valores = [];
let estado = 'listo';   // listo | agitando | tapado | destapado | inicial
let ciega = false;

function leer(k, def, min, max) {
  try { const v = parseInt(localStorage.getItem(k), 10); return v >= min && v <= max ? v : def; }
  catch { return def; }
}
function guardar() {
  try { localStorage.setItem('cacho.cantidad', cantidad); localStorage.setItem('cacho.reserva', reserva); } catch {}
}
function rand() { const a = new Uint32Array(1); crypto.getRandomValues(a); return a[0] / 4294967296; }

// =====================================================================
// Escena 3D
// =====================================================================
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;

const scene = new THREE.Scene();
scene.background = new THREE.Color('#08180f');
scene.fog = new THREE.Fog('#08180f', 16, 34);
const camera = new THREE.PerspectiveCamera(34, 1, 0.1, 100);

// Luces
scene.add(new THREE.HemisphereLight('#fff6e6', '#0b2416', 0.55));
const foco = new THREE.SpotLight('#fff1d6', 260, 40, Math.PI / 5, 0.55, 1.6);
foco.position.set(-3, 13, 5);
foco.target.position.set(0, 0, 0.5);
foco.castShadow = true;
foco.shadow.mapSize.set(1024, 1024);
foco.shadow.bias = -0.0004;
foco.shadow.radius = 6;
scene.add(foco, foco.target);
const relleno = new THREE.DirectionalLight('#cfe3ff', 0.35);
relleno.position.set(5, 6, 8);
scene.add(relleno);

// ---------- Texturas generadas (sin archivos) ----------
function lienzo(w, h, dibujar) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  dibujar(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = 4;
  return t;
}
function ruido(g, w, h, n, alpha, claro) {
  for (let i = 0; i < n; i++) {
    g.fillStyle = (Math.random() < .5 ? (claro || '#ffffff') : '#000000');
    g.globalAlpha = Math.random() * alpha;
    g.fillRect(Math.random() * w, Math.random() * h, 1 + Math.random() * 2, 1 + Math.random() * 2);
  }
  g.globalAlpha = 1;
}

// Paño de la mesa
const texPano = lienzo(512, 512, (g, w, h) => {
  g.fillStyle = '#1f6a43'; g.fillRect(0, 0, w, h);
  ruido(g, w, h, 26000, .10);
});
texPano.wrapS = texPano.wrapT = THREE.RepeatWrapping;
texPano.repeat.set(10, 10);
const mesa = new THREE.Mesh(
  new THREE.PlaneGeometry(60, 60),
  new THREE.MeshStandardMaterial({ map: texPano, roughness: 1 })
);
mesa.rotation.x = -Math.PI / 2;
mesa.receiveShadow = true;
scene.add(mesa);

// ---------- El vaso (cacho) ----------
const R = 2.35;          // radio de la boca
const ALTO = 3.3;
// Perfil del vaso: de la boca (abajo) a la tapa (arriba)
const perfil = [];
const N = 44;
perfil.push(new THREE.Vector2(R - 0.04, 0));
for (let i = 0; i <= N; i++) {
  const t = i / N, y = 0.04 + t * (ALTO - 0.3);
  let r = R - 0.42 * t;                         // se angosta hacia arriba
  if (y < 0.32) r += 0.07;                       // refuerzo de la boca
  perfil.push(new THREE.Vector2(r, y));
}
for (let i = 1; i <= 8; i++) {                   // tapa redondeada
  const a = (i / 8) * Math.PI / 2, rTop = R - 0.42;
  perfil.push(new THREE.Vector2(0.28 + (rTop - 0.28) * Math.cos(a), ALTO - 0.26 + 0.24 * Math.sin(a)));
}
perfil.push(new THREE.Vector2(0, ALTO - 0.01));
const vDe = idx => idx / (perfil.length - 1);   // coordenada v de la textura para un punto del perfil
const idxAltura = y => 1 + Math.round(((y - 0.04) / (ALTO - 0.3)) * N);

const texCuero = lienzo(1024, 1024, (g, w, h) => {
  const grd = g.createLinearGradient(0, 0, 0, h);
  grd.addColorStop(0, '#241309'); grd.addColorStop(1, '#3d2414');
  g.fillStyle = grd; g.fillRect(0, 0, w, h);
  ruido(g, w, h, 60000, .09, '#c08a5a');
  // vetas
  g.globalAlpha = .12; g.strokeStyle = '#0d0603';
  for (let i = 0; i < 90; i++) { g.lineWidth = .5 + Math.random(); g.beginPath(); const y = Math.random() * h; g.moveTo(0, y); g.bezierCurveTo(w * .3, y + 8, w * .6, y - 8, w, y + Math.random() * 6); g.stroke(); }
  g.globalAlpha = 1;
  // costuras a dos alturas
  const costura = y => {
    const py = (1 - vDe(idxAltura(y))) * h;
    g.strokeStyle = 'rgba(0,0,0,.45)'; g.lineWidth = 7; g.beginPath(); g.moveTo(0, py); g.lineTo(w, py); g.stroke();
    g.setLineDash([16, 10]); g.strokeStyle = '#e0bd76'; g.lineWidth = 4;
    g.beginPath(); g.moveTo(0, py); g.lineTo(w, py); g.stroke(); g.setLineDash([]);
  };
  costura(0.55); costura(2.55);
  // banda de la boca un poco más oscura
  const pyBoca = (1 - vDe(idxAltura(0.3))) * h;
  g.fillStyle = 'rgba(0,0,0,.28)'; g.fillRect(0, pyBoca, w, h - pyBoca);
});
const matCuero = new THREE.MeshStandardMaterial({ map: texCuero, bumpMap: texCuero, bumpScale: 0.02, roughness: 0.62, metalness: 0.05 });
const exterior = new THREE.Mesh(new THREE.LatheGeometry(perfil, 96), matCuero);
exterior.castShadow = true;

// Interior oscuro (se ve cuando el vaso se inclina)
const perfilInt = perfil.map(p => new THREE.Vector2(Math.max(0, p.x - 0.09), Math.max(0, p.y - 0.05)));
const interior = new THREE.Mesh(
  new THREE.LatheGeometry(perfilInt, 96),
  new THREE.MeshStandardMaterial({ color: '#160b05', roughness: 0.9, side: THREE.BackSide })
);
// Canto de la boca
const canto = new THREE.Mesh(
  new THREE.RingGeometry(R - 0.09 + 0.07, R + 0.03 + 0.07, 96, 1),
  new THREE.MeshStandardMaterial({ color: '#2a170b', roughness: 0.8, side: THREE.DoubleSide })
);
canto.rotation.x = -Math.PI / 2;
canto.position.y = 0.005;

// El vaso cuelga de un pivote ubicado en el borde de ATRÁS de la boca, sobre la mesa.
// Al girar el pivote, ese borde se queda apoyado y el de adelante sube.
const pivote = new THREE.Group();
pivote.position.set(0, 0, -(R + 0.07));
const vaso = new THREE.Group();
vaso.position.set(0, 0, R + 0.07);
vaso.add(exterior, interior, canto);
pivote.add(vaso);
scene.add(pivote);

// ---------- Dados ----------
const CARAS = { 1: [4], 2: [2, 6], 3: [2, 4, 6], 4: [0, 2, 6, 8], 5: [0, 2, 4, 6, 8], 6: [0, 2, 3, 5, 6, 8] };
const texCara = {};
for (let v = 1; v <= 6; v++) {
  texCara[v] = lienzo(256, 256, (g, w, h) => {
    const grd = g.createLinearGradient(0, 0, w, h);
    grd.addColorStop(0, '#ffffff'); grd.addColorStop(1, '#ebe5da');
    g.fillStyle = grd; g.fillRect(0, 0, w, h);
    ruido(g, w, h, 1500, .03);
    const as = v === 1, r = as ? 34 : 23;
    CARAS[v].forEach(c => {
      const x = 52 + (c % 3) * 76, y = 52 + Math.floor(c / 3) * 76;
      const pg = g.createRadialGradient(x - r * .35, y - r * .35, r * .1, x, y, r);
      if (as) { pg.addColorStop(0, '#ff6a5e'); pg.addColorStop(.5, '#b3261e'); pg.addColorStop(1, '#4a0905'); }
      else { pg.addColorStop(0, '#5a5a5a'); pg.addColorStop(.45, '#141414'); pg.addColorStop(1, '#000'); }
      g.fillStyle = pg; g.beginPath(); g.arc(x, y, r, 0, Math.PI * 2); g.fill();
    });
  });
}
const matCara = {};
for (let v = 1; v <= 6; v++) matCara[v] = new THREE.MeshStandardMaterial({ map: texCara[v], roughness: 0.32, metalness: 0 });
const LADO = 0.82;
const geoDado = new RoundedBoxGeometry(LADO, LADO, LADO, 5, 0.12);

// Orden de caras del cubo en three: +x, -x, +y, -y, +z, -z. Arriba (+y) va el valor.
function materialesPara(v) {
  const resto = [1, 2, 3, 4, 5, 6].filter(n => n !== v && n !== 7 - v);
  const a = resto[0], b = resto.find(n => n !== a && n !== 7 - a);
  return [matCara[a], matCara[7 - a], matCara[v], matCara[7 - v], matCara[b], matCara[7 - b]];
}

const POS = {
  1: [[0, 0.1]],
  2: [[-0.62, 0.05], [0.62, 0.1]],
  3: [[-0.7, -0.45], [0.72, -0.4], [0, 0.65]],
  4: [[-0.68, -0.62], [0.68, -0.66], [-0.66, 0.66], [0.7, 0.62]],
  5: [[-0.95, -0.72], [0.92, -0.8], [0, 0.0], [-0.9, 0.86], [0.95, 0.82]],
};
const grupoDados = new THREE.Group();
scene.add(grupoDados);
function ponerDados() {
  grupoDados.clear();
  const pos = POS[valores.length] || [];
  valores.forEach((v, i) => {
    const d = new THREE.Mesh(geoDado, materialesPara(v));
    const [x, z] = pos[i];
    d.position.set(x + (rand() - .5) * .16, LADO / 2, z + (rand() - .5) * .16);
    d.rotation.y = (rand() - .5) * 1.2;
    d.castShadow = true; d.receiveShadow = true;
    grupoDados.add(d);
  });
}

// ---------- Cámara: mirando la mesa desde adelante y arriba ----------
function encuadrar() {
  const w = innerWidth, h = innerHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  const vfov = THREE.MathUtils.degToRad(camera.fov);
  const hfov = 2 * Math.atan(Math.tan(vfov / 2) * camera.aspect);
  const ancho = (R + 0.2) * 2 * 0.98;                     // el vaso llena el ancho
  let d = (ancho / 2) / Math.tan(hfov / 2);
  d = Math.max(d, 9);
  const dir = new THREE.Vector3(0, 1.0, 0.9).normalize();
  const mira = new THREE.Vector3(0, 1.15, -0.1);
  camera.position.copy(mira).addScaledVector(dir, d);
  camera.lookAt(mira);
  camera.updateProjectionMatrix();
}
addEventListener('resize', encuadrar);
encuadrar();

// =====================================================================
// Movimiento del vaso
// =====================================================================
let giro = 0, giroObjetivo = 0, vel = 0;   // grados hacia atrás
let arrastrando = false, inicioY = 0, giroInicio = 0, movio = false;
let agitarHasta = 0;
const GIRO_MAX = 78, GIRO_FUERA = 95;
let salida = 0;   // 0 = en la mesa, 1 = el vaso se fue fuera de la pantalla

const puedeMirar = () => !(ciega && cantidad > 1);
const fuera = () => estado === 'destapado' || estado === 'inicial';

canvas.addEventListener('pointerdown', e => {
  if (cantidad === 0) return;
  try { canvas.setPointerCapture(e.pointerId); } catch {}
  arrastrando = true; movio = false; inicioY = e.clientY; giroInicio = giro;
});
canvas.addEventListener('pointermove', e => {
  if (!arrastrando) return;
  const dy = inicioY - e.clientY;
  if (Math.abs(dy) > 8) movio = true;
  if (estado !== 'tapado') return;
  const tope = puedeMirar() ? GIRO_MAX : 4;
  // el borde de adelante sigue al dedo
  const g = giroInicio + (dy / innerHeight) * 150;
  giroObjetivo = Math.max(0, Math.min(tope, g));
  giro = giroObjetivo; vel = 0;
  actualizarUI();
});
function soltar() {
  if (!arrastrando) return;
  arrastrando = false;
  if (!movio && estado === 'listo') agitar();
  else if (!movio && estado === 'tapado' && !puedeMirar()) vibrar([20, 60, 20]);
  if (estado === 'tapado') giroObjetivo = 0;   // al soltar, el vaso cae
  actualizarUI();
}
['pointerup', 'pointercancel', 'lostpointercapture'].forEach(ev => canvas.addEventListener(ev, soltar));
canvas.addEventListener('contextmenu', e => e.preventDefault());

let ultimo = performance.now(), yaGolpeo = true;
function cuadro(ahora) {
  const dt = Math.min(0.05, (ahora - ultimo) / 1000); ultimo = ahora;
  if (!arrastrando) {
    // resorte con un pequeño rebote al caer sobre la mesa
    const k = giroObjetivo === 0 ? 210 : 90, amort = giroObjetivo === 0 ? 17 : 14;
    vel += ((giroObjetivo - giro) * k - vel * amort) * dt;
    giro += vel * dt;
    if (giro < 0) {                       // golpe contra la mesa
      giro = -giro * 0.25; vel = -vel * 0.25;
      if (!yaGolpeo && Math.abs(vel) > 4) { vibrar(15); }
      yaGolpeo = true;
    }
    if (giro > 6) yaGolpeo = false;
  }
  pivote.rotation.x = -THREE.MathUtils.degToRad(giro);
  // Al destapar del todo, el vaso se levanta y se va hacia atrás, fuera de la vista
  const salidaObjetivo = fuera() ? 1 : 0;
  salida += (salidaObjetivo - salida) * Math.min(1, dt * (salidaObjetivo ? 3.2 : 8));
  pivote.position.set(0, salida * 4.5, -(R + 0.07) - salida * 9);

  // Agitar: el vaso se sacude sobre la mesa
  if (ahora < agitarHasta) {
    const t = ahora / 1000;
    vaso.position.x = Math.sin(t * 47) * 0.12;
    vaso.position.z = (R + 0.07) + Math.cos(t * 39) * 0.1;
    vaso.position.y = Math.abs(Math.sin(t * 31)) * 0.12;
    vaso.rotation.z = Math.sin(t * 43) * 0.05;
  } else {
    vaso.position.set(0, 0, R + 0.07); vaso.rotation.z = 0;
  }

  const visible = fuera() || giro > 30;
  resumen.classList.toggle('visible', visible && estado !== 'agitando');

  renderer.render(scene, camera);
  requestAnimationFrame(cuadro);
}
requestAnimationFrame(cuadro);
$('cargando').remove();

// =====================================================================
// Juego
// =====================================================================
const tieneSalpicon = () => valores.length === 5 && new Set(valores).size === 5;

function textoResumen() {
  if (!valores.length) return '';
  if (estado === 'inicial') return `Sacaste <em>${valores[0]}</em> · el más alto empieza`;
  const cuenta = {};
  valores.forEach(v => cuenta[v] = (cuenta[v] || 0) + 1);
  let t = Object.keys(cuenta).sort((a, b) => a - b)
    .map(k => { const n = `${cuenta[k]} ${cuenta[k] > 1 ? NOMBRES[k] : NOMBRE1[k]}`; return k == 1 ? `<span>${n}</span>` : n; })
    .join(' · ');
  if (tieneSalpicon()) t += ' · <em>¡Salpicón!</em>';
  return t;
}

function actualizarUI() {
  const ocupado = estado === 'agitando';
  $('numBarra').textContent = cantidad;
  $('resBarra').textContent = reserva ? `+${reserva}` : '';
  numEl.textContent = cantidad;
  nota.textContent = reserva ? `Tienes ${reserva} de reserva: la próxima vez que pierdas, sigues con ${cantidad}.` : '';
  btnMenos.disabled = (cantidad <= 0 && !reserva) || ocupado;
  btnMas.disabled = ocupado;
  btnInicial.disabled = ocupado || cantidad === 0;
  btnCiega.disabled = ocupado || estado === 'tapado' || cantidad === 0;
  btnCiega.setAttribute('aria-pressed', ciega);

  eliminado.classList.toggle('visible', cantidad === 0);
  pivote.visible = cantidad > 0;

  btnDestapar.textContent = fuera() ? 'Nueva ronda' : 'Destapar';
  btnDestapar.disabled = !(estado === 'tapado' || fuera()) || cantidad === 0;

  resumen.innerHTML = textoResumen();
  pista.innerHTML = cantidad === 0 ? '' : {
    listo: ciega ? 'Ronda ciega · toca el vaso o sacude el celular' : 'Toca el vaso o sacude el celular para agitar',
    agitando: 'Agitando…',
    tapado: puedeMirar() ? '<span class="flecha">▲</span>Desliza hacia arriba para mirar tus dados'
                         : 'Ronda ciega: esta ronda no ves tus dados',
    destapado: 'Dados a la vista de todos',
    inicial: 'El más alto empieza · si empatan, vuelven a tirar',
  }[estado];
}

function agitar(n = cantidad, inicial = false) {
  if (cantidad === 0 || estado === 'agitando') return;
  const empezar = () => {
    estado = 'agitando';
    agitarHasta = performance.now() + 1000;
    vibrar([30, 40, 30, 40, 30, 40, 30]);
    sonidoAgitar();
    actualizarUI();
    setTimeout(() => {
      valores = Array.from({ length: n }, () => 1 + Math.floor(rand() * 6));
      ponerDados();
      estado = inicial ? 'inicial' : 'tapado';
      if (inicial) giroObjetivo = GIRO_FUERA;
      vibrar(60);
      actualizarUI();
    }, 1000);
  };
  // Si el vaso está levantado, primero baja y después se agita
  if (giro > 3) { giroObjetivo = 0; estado = 'listo'; actualizarUI(); setTimeout(empezar, 450); }
  else empezar();
}

btnDestapar.addEventListener('click', () => {
  if (estado === 'tapado') {
    estado = 'destapado'; ciega = false;       // la ronda ciega es solo para esa ronda
    giroObjetivo = GIRO_FUERA;
    vibrar(40); actualizarUI();
  } else if (fuera()) {
    agitar();
  }
});

// ---------- Menú ----------
function abrirMenu(si) { menu.classList.toggle('abierto', si); velo.classList.toggle('abierto', si); }
$('abrirMenu').addEventListener('click', () => abrirMenu(true));
$('abrirMenu2').addEventListener('click', () => abrirMenu(true));
$('cerrar').addEventListener('click', () => abrirMenu(false));
velo.addEventListener('click', () => abrirMenu(false));
btnMenos.addEventListener('click', () => { if (reserva > 0) reserva--; else if (cantidad > 0) cantidad--; reiniciarMesa(); });
btnMas.addEventListener('click', () => { if (cantidad >= MAX) reserva++; else cantidad++; reiniciarMesa(); });
btnNueva.addEventListener('click', () => { cantidad = MAX; reserva = 0; ciega = false; reiniciarMesa(); abrirMenu(false); });
btnCiega.addEventListener('click', () => { ciega = !ciega; actualizarUI(); });
btnInicial.addEventListener('click', () => { abrirMenu(false); agitar(1, true); });

function reiniciarMesa() {
  guardar();
  valores = []; grupoDados.clear();
  estado = 'listo'; giroObjetivo = 0;
  actualizarUI();
}

// ---------- Sacudir el celular ----------
// iPhone solo deja pedir el permiso dentro de un toque completo (click/touchend).
let escuchando = false, pidiendo = false, negado = false, ultimaSacudida = 0, golpes = [];
function pedirPermisoMovimiento() {
  if (escuchando || pidiendo || negado) return;
  const DME = window.DeviceMotionEvent;
  if (!DME) return;
  if (typeof DME.requestPermission === 'function') {
    pidiendo = true;
    DME.requestPermission()
      .then(r => {
        if (r === 'granted') { escucharMovimiento(); aviso('Sacudir activado: agita el celular para revolver'); }
        else { negado = true; aviso('Sin permiso de movimiento: toca el vaso para agitar'); }
      })
      .catch(() => {})
      .finally(() => { pidiendo = false; });
  } else escucharMovimiento();
}
function escucharMovimiento() {
  if (escuchando) return;
  escuchando = true;
  addEventListener('devicemotion', e => {
    let f;
    if (e.acceleration && e.acceleration.x !== null) { const a = e.acceleration; f = Math.hypot(a.x, a.y, a.z); }
    else if (e.accelerationIncludingGravity) { const a = e.accelerationIncludingGravity; f = Math.abs(Math.hypot(a.x, a.y, a.z) - 9.8); }
    else return;
    const ahora = Date.now();
    if (f > 11) golpes.push(ahora);
    golpes = golpes.filter(t => ahora - t < 500);
    const sePuede = estado === 'listo' || fuera() || (estado === 'tapado' && !arrastrando && giro < 2);
    if (golpes.length >= 2 && ahora - ultimaSacudida > 1500 && sePuede && !menu.classList.contains('abierto')) {
      ultimaSacudida = ahora; golpes = []; agitar();
    }
  });
}
['click', 'touchend'].forEach(ev => document.addEventListener(ev, pedirPermisoMovimiento));

let timerAviso;
function aviso(txt) {
  const el = $('aviso'); el.textContent = txt; el.classList.add('visible');
  clearTimeout(timerAviso); timerAviso = setTimeout(() => el.classList.remove('visible'), 2600);
}
function vibrar(p) { try { navigator.vibrate && navigator.vibrate(p); } catch {} }

// Sonido de dados dentro del vaso (generado)
let audio;
function sonidoAgitar() {
  try {
    audio = audio || new (window.AudioContext || window.webkitAudioContext)();
    const t0 = audio.currentTime;
    for (let i = 0; i < 15; i++) {
      const t = t0 + i * 0.062 + Math.random() * 0.03, len = 0.03;
      const buf = audio.createBuffer(1, Math.floor(audio.sampleRate * len), audio.sampleRate);
      const d = buf.getChannelData(0);
      for (let j = 0; j < d.length; j++) d[j] = (Math.random() * 2 - 1) * Math.pow(1 - j / d.length, 3);
      const src = audio.createBufferSource(); src.buffer = buf;
      const f = audio.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = 1500 + Math.random() * 1500; f.Q.value = 2;
      const g = audio.createGain(); g.gain.value = 0.5;
      src.connect(f).connect(g).connect(audio.destination); src.start(t);
    }
  } catch {}
}

actualizarUI();
